name: Verify release

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  host-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run release verification
        run: python tests/verify_release.py

      - name: Run focused regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Compile calculator runtime self-test for host
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -O2 -Isrc
          tests/runtime_self_test_host.cpp
          src/big_num.cpp src/content.cpp src/game_state.cpp
          src/systems.cpp src/validation.cpp
          -o runtime_self_test

      - name: Execute calculator runtime self-test
        run: ./runtime_self_test
