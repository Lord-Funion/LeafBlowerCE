name: Apply radial blower source update

on:
  push:
    branches: ["agent/always-on-radial-blower-v2"]
    paths: [".github/workflows/verify.yml"]

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/always-on-radial-blower-v2

      - name: Apply source, documentation, and tests
        run: python tools/apply_radial_blower_patch.py

      - name: Commit completed update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make blower always-on and radial"
          git push origin HEAD:agent/always-on-radial-blower-v2
